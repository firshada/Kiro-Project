name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - run: uv sync --locked
      - name: Two separate processes must produce byte-identical reports
        env:
          PYTHONPATH: src
        run: |
          files="tests/fixtures/customers.csv tests/fixtures/transactions.csv tests/fixtures/products.csv"
          for fmt in json html; do
            uv run python -m profiler $files --rules tests/fixtures/rules.json --format $fmt --stdout > a.$fmt
            PYTHONHASHSEED=123 uv run python -m profiler $files --rules tests/fixtures/rules.json --format $fmt --stdout > b.$fmt
            cmp a.$fmt b.$fmt
          done
